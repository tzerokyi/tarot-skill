[package]
name = "tarot-skill"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Native Rust tarot deck, weighted draw, and relation-analysis core with a CLI"
repository = "https://github.com/tzerokyi/tarot-skill"
readme = "README.md"
keywords = ["tarot", "divination", "cli", "cards"]
categories = ["command-line-utilities"]

[lib]
name = "tarot_core"
path = "src/lib.rs"

[[bin]]
name = "tarot"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
